<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Asanas">
<meta name="theme-color" content="#EEF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#132630" media="(prefers-color-scheme: dark)">
<title>Asanas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF3F4; --card: #FFFFFF; --soft: #E2EBED; --tx: #1E3440; --mu: #5F7A86;
  --line: rgba(30,52,64,.13); --ac: #E06C5A; --ac-tx: #B4483A; --ac-soft: #FBE7E3; --on-ac: #FFFFFF;
  --ok: #3F8F8A; --serif: 'Fraunces', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --tab-h: 62px; --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #132630; --card: #1B3340; --soft: #23404E; --tx: #E8F0F2; --mu: #9DB3BC;
  --line: rgba(232,240,242,.13); --ac: #E8806F; --ac-tx: #F2A193; --ac-soft: #3A2C30; --on-ac: #1E1210;
  --ok: #5DB3AD; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; padding-bottom: calc(var(--tab-h) + var(--safe-b)); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1040px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 24px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -.01em; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.top h1 { font-size: 30px; }
.muted { color: var(--mu); }
.small { font-size: 13px; }

/* Suche und Filter */
.search { position: relative; margin-bottom: 10px; }
.search input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 40px 0 14px; font-size: 16px; outline: none; }
.search input:focus { border-color: var(--ac); }
.search .clear { position: absolute; right: 6px; top: 7px; width: 32px; height: 32px; border: 0; background: transparent; color: var(--mu); font-size: 20px; cursor: pointer; }
.fbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.fbtn { height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px; }
.fbtn.on { border-color: var(--ac); color: var(--ac-tx); background: var(--ac-soft); }
.fpanel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 4px; margin-bottom: 12px; }
.fgroup { margin-bottom: 10px; }
.fgroup h3 { font-family: var(--sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--mu); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 13.5px; cursor: pointer; line-height: 1.2; }
.chip.on { background: var(--tx); color: var(--bg); border-color: var(--tx); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip.ph.on { color: var(--ph-tx); background: var(--ph); border-color: var(--ph); }
.count { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mu); margin: 4px 2px 10px; }
.linkbtn { border: 0; background: none; color: var(--ac-tx); cursor: pointer; padding: 6px 0; font-size: 13px; }

/* Liste */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.card { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; min-height: 84px; }
.card:active { transform: scale(.99); }
.thumb { width: 92px; height: 66px; border-radius: 10px; flex: none; overflow: hidden; background: var(--soft); display: flex; align-items: center; justify-content: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .ph-ini { font-family: var(--serif); font-size: 22px; color: var(--mu); }
.cbody { min-width: 0; flex: 1; }
.cbody .en { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.2; }
.cbody .de { font-size: 14px; margin-top: 2px; }
.cbody .sa { font-size: 12.5px; color: var(--mu); font-style: italic; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmeta { display: flex; gap: 5px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
.pdot { width: 10px; height: 10px; border-radius: 50%; }
.basic { font-size: 11px; color: var(--mu); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; }
.empty { text-align: center; padding: 40px 10px; color: var(--mu); }

/* Pose */
.navbar { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; border-bottom: 1px solid var(--line); }
.navbar .pos { flex: 1; text-align: center; font-size: 13px; color: var(--mu); }
.ibtn { min-width: 44px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.ibtn[disabled] { opacity: .35; cursor: default; }
.pose { max-width: 820px; margin: 0 auto; padding: 14px 16px 30px; }
.hero { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.hero img { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: #fff; }
.hero.none { aspect-ratio: 16/7; display: flex; align-items: center; justify-content: center; color: var(--mu); font-size: 14px; background: var(--soft); }
.thumbs { display: flex; gap: 8px; padding: 8px; overflow-x: auto; }
.thumbs button { border: 2px solid transparent; border-radius: 8px; padding: 0; background: none; cursor: pointer; flex: none; }
.thumbs button.on { border-color: var(--ac); }
.thumbs img { width: 70px; height: 48px; object-fit: cover; border-radius: 6px; display: block; }
.names { margin: 16px 2px 10px; }
.names h1 { font-size: 30px; line-height: 1.1; }
.names .de { font-size: 19px; margin-top: 4px; }
.names .sa { font-size: 15px; color: var(--mu); font-style: italic; margin-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.tag { font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
.tag.ph { background: var(--ph); color: var(--ph-tx); border-color: var(--ph); }
.tag.tg { border-color: var(--ac); color: var(--ac-tx); }
.note { font-size: 12.5px; color: var(--mu); margin: 6px 2px 14px; }
.cue { background: var(--ac-soft); border-radius: 14px; padding: 12px 16px; margin: 12px 0; }
.cue h2 { font-size: 18px; margin-bottom: 6px; color: var(--ac-tx); }
.cue ol { margin: 0; padding-left: 22px; line-height: 1.55; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 8px 0; }
.sec summary { list-style: none; cursor: pointer; padding: 13px 16px; font-family: var(--serif); font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.sec summary::-webkit-details-marker { display: none; }
.sec summary::after { content: '+'; font-family: var(--sans); color: var(--mu); font-weight: 400; font-size: 22px; }
.sec[open] summary::after { content: '–'; }
.sec .in { padding: 0 16px 14px; line-height: 1.55; }
.sec .in p { margin: 0 0 8px; }
.sec ul, .sec ol { margin: 0; padding-left: 22px; }
.sec li { margin: 2px 0; }
.sec a.pl { color: var(--ac-tx); text-decoration: underline; text-underline-offset: 2px; }
.box { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 14px 16px; color: var(--mu); margin: 12px 0; line-height: 1.5; }

/* Lernen */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.panel h2 { font-size: 19px; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-family: var(--serif); font-size: 26px; }
.stat span { font-size: 12.5px; color: var(--mu); }
.btn { height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 16px; font-weight: 600; }
.btn.solid { background: var(--ac); border-color: var(--ac); color: var(--on-ac); }
.btn.wide { width: 100%; }
.btn.sm { height: 38px; font-size: 14px; padding: 0 14px; font-weight: 500; }
.flash { max-width: 560px; margin: 0 auto; }
.prog { height: 6px; background: var(--soft); border-radius: 9px; overflow: hidden; margin: 6px 0 12px; }
.prog i { display: block; height: 100%; background: var(--ac); border-radius: 9px; transition: width .25s; }
.fc { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.fc .dir { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mu); }
.fc .q { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.15; }
.fc .qi { width: 100%; max-height: 280px; object-fit: contain; border-radius: 12px; background: #fff; }
.fc .a { border-top: 1px solid var(--line); width: 100%; padding-top: 12px; margin-top: 6px; }
.fc .a .big { font-family: var(--serif); font-size: 24px; font-weight: 600; }
.fc .a .sub { font-size: 16px; margin-top: 3px; }
.fc .a .sa { font-size: 14px; color: var(--mu); font-style: italic; margin-top: 3px; }
.fc .a .mini { width: 140px; height: 94px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
.answer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.btn.again { color: var(--ac-tx); }
.btn.know { background: var(--ok); border-color: var(--ok); color: #fff; }

/* Einstellungen */
.set h2 { font-size: 19px; margin-bottom: 8px; }
.set p { margin: 0 0 10px; line-height: 1.5; }
.set ol { padding-left: 20px; margin: 0; }
.set ol li { margin-bottom: 12px; }
.field { display: block; margin: 6px 0 10px; }
.field span { display: block; font-size: 13px; color: var(--mu); margin-bottom: 4px; }
.field input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 9px 14px; cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--tx); color: var(--bg); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
.sw { width: 50px; height: 30px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.sw.on { background: var(--ok); border-color: var(--ok); }
.sw.on::after { left: 22px; }
.err { color: #C0392B; font-size: 14px; }

/* Tabs und Hinweise */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs a { flex: 1; max-width: 200px; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--mu); }
.tabs a svg { width: 24px; height: 24px; }
.tabs a.on { color: var(--ac-tx); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 14px); transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.welcome { text-align: center; padding: 30px 10px; }
.welcome h2 { font-size: 24px; margin-bottom: 8px; }
.welcome p { color: var(--mu); line-height: 1.5; max-width: 460px; margin: 0 auto 16px; }
@media (min-width: 760px) { .top h1 { font-size: 34px; } .fc .q { font-size: 34px; } }
</style>
</head>

  <a href="#/einstellungen" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</a>
</nav>

<script>
(function () {
  'use strict';
  var VERSION = '2';
  /* Dropbox-App-Schlüssel (öffentlich, kein Geheimnis). Dieselbe Dropbox-App wie beim Moderationsdeck. */
  var APP_KEY = 'prtle6jx22kouds';
  var DEFAULT_FOLDER = '/03 Apps/Yoga/app-daten';
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var DATA_CACHE = 'asanas-daten';
  var PHASE = {
    'Warm-up':    { c: '#F2B45C', t: '#4A3208', de: 'Aufwärmen' },
    'Build-up':   { c: '#E06C5A', t: '#FFFFFF', de: 'Aufbauen' },
    'Peak':       { c: '#B23A48', t: '#FFFFFF', de: 'Höhepunkt' },
    'Cool-down':  { c: '#3F8F8A', t: '#FFFFFF', de: 'Runterfahren' },
    'Relaxation': { c: '#5A6FA8', t: '#FFFFFF', de: 'Entspannung' }
  };
  var DIRS = [
    { k: 'enDe', label: 'English → Deutsch' },
    { k: 'deEn', label: 'Deutsch → English' },
    { k: 'img',  label: 'Bild → Name' },
    { k: 'sa',   label: 'Sanskrit → Name', sa: true }
  ];
  var INTERVAL = [0, 0, 1, 3, 7, 16]; /* Tage bis zur nächsten Abfrage je Stufe 1–5 */
  var SESSION_SIZE = 20;

  /* ---------- Speicher ---------- */
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var pref = Object.assign({ theme: 'auto', sanskrit: false, folder: DEFAULT_FOLDER, dirs: { enDe: true, deEn: true, img: true, sa: false }, scope: 'all' }, lsGet('as.pref', {}));
  function savePref() { lsSet('as.pref', pref); }
  var auth = lsGet('as.auth', null);
  function saveAuth() { lsSet('as.auth', auth); }
  var learn = lsGet('as.learn', {});
  function saveLearn() { lsSet('as.learn', learn); }

  var S = {
    data: null, byId: {}, imgs: {}, list: [], filterOpen: false,
    f: { q: '', phases: [], types: [], targets: [] },
    imgIdx: {}, session: null, syncing: false, connectErr: ''
  };

  /* ---------- Hilfen ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’']/g, ''); }
  var toastT;
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || 2600); }
  function phStyle(p) { var x = PHASE[p] || { c: '#888', t: '#fff' }; return '--ph:' + x.c + ';--ph-tx:' + x.t; }
  function initials(en) { return en.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join(''); }
  function applyTheme() {
    var dark = pref.theme === 'dark' || (pref.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  applyTheme();

  /* ---------- Dropbox ---------- */
  function hj(o) { return JSON.stringify(o).replace(/[\u007f-￿]/g, function (c) { return '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4); }); }
  function b64url(buf) { var s = '', b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function connected() { return !!(auth && auth.refresh); }
  async function prepareConnect() {
    var v = b64url(crypto.getRandomValues(new Uint8Array(48)));
    lsSet('as.pkce', v);
    var ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
    return 'https://www.dropbox.com/oauth2/authorize?client_id=' + encodeURIComponent(APP_KEY) + '&response_type=code&code_challenge=' + ch + '&code_challenge_method=S256&token_access_type=offline';
  }
  var TOKEN_URL = 'https://api.dropboxapi.com/oauth2/token';
  async function exchange(code) {
    var v = lsGet('as.pkce', null);
    if (!v) throw new Error('Tippe zuerst auf „Bei Dropbox anmelden“.');
    var r = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ code: code.trim(), grant_type: 'authorization_code', code_verifier: v, client_id: APP_KEY }) });
    if (!r.ok) throw new Error('Der Code hat nicht funktioniert. Hol dir bei Dropbox einen neuen und füge ihn ein.');
    var j = await r.json();
    auth = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 14400) * 1000 };
    saveAuth(); lsSet('as.pkce', null);
  }
  async function token() {
    if (!connected()) throw { code: 'auth' };
    if (auth.access && auth.exp - Date.now() > 60000) return auth.access;
    var r = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: auth.refresh, client_id: APP_KEY }) });
    if (!r.ok) { if (r.status === 400 || r.status === 401) { auth = null; saveAuth(); } throw { code: 'auth' }; }
    var j = await r.json();
    auth.access = j.access_token; auth.exp = Date.now() + (j.expires_in || 14400) * 1000; saveAuth();
    return auth.access;
  }
  async function getFile(rel) {
    if (LOCAL) {
      var lr = await fetch('dev-daten/' + rel, { cache: 'no-cache' });
      if (!lr.ok) throw { code: lr.status, summary: 'not_found' };
      return lr;
    }
    var t = await token();
    var r = await fetch('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Dropbox-API-Arg': hj({ path: pref.folder + '/' + rel }) } });
    if (r.status === 401) { auth.exp = 0; saveAuth(); throw { code: 'auth' }; }
    if (!r.ok) { var txt = ''; try { txt = await r.text(); } catch (e) {} throw { code: r.status, summary: txt }; }
    return r;
  }
  function errText(err) {
    if (err && err.code === 'auth') return 'Die Verbindung zu Dropbox ist abgelaufen. Verbinde dich in den Einstellungen neu.';
    if (err && (err.code === 409 || err.code === 404) && /not_found/.test(err.summary || '')) return 'In deiner Dropbox fehlt der Ordner „' + pref.folder + '“ oder die Datei asanas.json.';
    if (err instanceof TypeError) return 'Keine Verbindung. Prüfe das Internet.';
    return 'Beim Laden ist ein Fehler aufgetreten (' + ((err && err.code) || '?') + ').';
  }

  /* ---------- Daten (offline im Cache) ---------- */
  function ckey(rel) { return new URL('__daten/' + rel, location.href).href; }
  async function loadCached() {
    try {
      var c = await caches.open(DATA_CACHE);
      var r = await c.match(ckey('asanas.json'));
      if (!r) return false;
      setData(await r.json());
      await loadImages(c);
      return true;
    } catch (e) { return false; }
  }
  function setData(d) {
    S.data = d; S.byId = {};
    d.poses.forEach(function (p) { S.byId[p.id] = p; });
  }
  async function loadImages(c) {
    Object.keys(S.imgs).forEach(function (k) { URL.revokeObjectURL(S.imgs[k]); });
    S.imgs = {};
    var names = [];
    S.data.poses.forEach(function (p) { names = names.concat(p.images); });
    await Promise.all(names.map(async function (n) {
      var r = await c.match(ckey('img/' + n));
      if (r) S.imgs[n] = URL.createObjectURL(await r.blob());
    }));
  }
  async function sync(manual) {
    if (S.syncing) return;
    if (!LOCAL && !connected()) { if (manual) toast('Erst mit Dropbox verbinden'); return; }
    if (!navigator.onLine) { if (manual) toast('Du bist offline. Die gespeicherten Daten bleiben.'); return; }
    S.syncing = true; if (manual) toast('Suche nach neuen Daten …', 1800);
    try {
      var c = await caches.open(DATA_CACHE);
      var res = await getFile('asanas.json');
      var text = await res.text();
      var d = JSON.parse(text);
      var need = [], all = {};
      d.poses.forEach(function (p) { p.images.forEach(function (n) { all[n] = 1; }); });
      for (var n in all) { if (!(await c.match(ckey('img/' + n)))) need.push(n); }
      var changed = !S.data || S.data.version !== d.version || need.length > 0;
      for (var i = 0; i < need.length; i++) {
        toast('Lade Zeichnungen ' + (i + 1) + ' von ' + need.length, 4000);
        var ir = await getFile('img/' + need[i]);
        await c.put(ckey('img/' + need[i]), new Response(await ir.blob(), { headers: { 'Content-Type': 'image/jpeg' } }));
      }
      var keys = await c.keys();
      for (var k = 0; k < keys.length; k++) {
        var m = keys[k].url.match(/__daten\/img\/(.+)$/);
        if (m && !all[decodeURIComponent(m[1])]) await c.delete(keys[k]);
      }
      await c.put(ckey('asanas.json'), new Response(text, { headers: { 'Content-Type': 'application/json' } }));
      lsSet('as.synced', Date.now());
      if (changed) {
        setData(d); await loadImages(c); render();
        toast('Daten aktualisiert: ' + d.poses.length + ' Posen');
      } else if (manual) toast('Alles aktuell');
    } catch (err) {
      if (manual || !S.data) toast(errText(err), 5000);
      if (err && err.code === 'auth' && location.hash.indexOf('einstellungen') > 0) render();
    } finally { S.syncing = false; }
  }

  /* ---------- Filter ---------- */
  function matches(p) {
    var f = S.f;
    if (f.q) {
      var q = norm(f.q), hay = norm(p.en + ' ' + p.de + ' ' + p.sa);
      if (q.split(/\s+/).some(function (w) { return hay.indexOf(w) < 0; })) return false;
    }
    if (f.phases.length && !p.phases.some(function (x) { return f.phases.indexOf(x) >= 0; })) return false;
    if (f.types.length && !p.types.some(function (x) { return f.types.indexOf(x) >= 0; })) return false;
    if (f.targets.length && !p.targets.some(function (x) { return f.targets.indexOf(x) >= 0; })) return false;
    return true;
  }
  function filtered() { return S.data ? S.data.poses.filter(matches) : []; }
  function nFilters() { return S.f.phases.length + S.f.types.length + S.f.targets.length; }

  /* ---------- Ansichten ---------- */
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/');
    if (parts[0] === 'pose' && parts[1]) return { v: 'pose', id: decodeURIComponent(parts[1]) };
    if (parts[0] === 'lernen') return { v: 'learn' };
    if (parts[0] === 'einstellungen') return { v: 'settings' };
    return { v: 'browse' };
  }
  function setTab(t) {
    Array.prototype.forEach.call(document.querySelectorAll('.tabs a'), function (a) { a.classList.toggle('on', a.getAttribute('data-tab') === t); });
  }
  function render() {
    var r = route();
    if (r.v === 'pose') { setTab('browse'); renderPose(r.id); }
    else if (r.v === 'learn') { setTab('learn'); renderLearn(); }
    else if (r.v === 'settings') { setTab('settings'); renderSettings(); }
    else { setTab('browse'); renderBrowse(); }
  }

  function welcome() {
    return '<div class="welcome"><h2>Willkommen</h2>' +
      '<p>Deine Posen liegen in deiner Dropbox im Ordner „' + esc(pref.folder) + '“. Verbinde die App einmal mit Dropbox. Danach speichert sie alles auf diesem Gerät, auch für unterwegs ohne Netz.</p>' +
      '<a class="btn solid" href="#/einstellungen" style="display:inline-flex;align-items:center">Mit Dropbox verbinden</a></div>';
  }

  /* Stöbern */
  function chip(group, value, label, on, ph) {
    return '<button class="chip' + (ph ? ' ph' : '') + (on ? ' on' : '') + '" data-f="' + group + '" data-v="' + esc(value) + '"' + (ph ? ' style="' + phStyle(value) + '"' : '') + '>' +
      (ph ? '<span class="dot" style="background:' + PHASE[value].c + '"></span>' : '') + esc(label) + '</button>';
  }
  function renderBrowse() {
    var app = $('app');

    var d = S.data, f = S.f;
    var h = '<div class="wrap"><div class="top"><h1>Asanas</h1><span class="muted small">' + d.poses.length + ' Posen</span></div>';
    h += '<div class="search"><input id="q" type="search" placeholder="Suchen: English, Deutsch, Sanskrit" value="' + esc(f.q) + '" autocomplete="off" autocorrect="off" spellcheck="false"><button class="clear" data-act="clear-q" aria-label="Suche löschen"' + (f.q ? '' : ' hidden') + '>×</button></div>';
    h += '<div class="fbar"><button class="fbtn' + (nFilters() ? ' on' : '') + '" data-act="toggle-filter">Filter' + (nFilters() ? ' (' + nFilters() + ')' : '') + (S.filterOpen ? ' ▴' : ' ▾') + '</button>';
    d.phases.forEach(function (p) { h += chip('phases', p, p, f.phases.indexOf(p) >= 0, true); });
    h += '</div>';
    if (S.filterOpen) {
      h += '<div class="fpanel"><div class="fgroup"><h3>Pose Type</h3><div class="chips">';
      d.types.forEach(function (t) { h += chip('types', t, t, f.types.indexOf(t) >= 0); });
      h += '</div></div><div class="fgroup"><h3>Target</h3><div class="chips">';
      d.targets.forEach(function (t) { h += chip('targets', t, t, f.targets.indexOf(t) >= 0); });
      h += '</div></div></div>';
    }
    h += '<div id="list"></div></div>';
    app.innerHTML = h;
    renderList();
  }
  function renderList() {
    var el = $('list'); if (!el) return;
    var list = filtered();
    S.list = list.map(function (p) { return p.id; });
    var h = '<div class="count"><span>' + list.length + (list.length === 1 ? ' Pose' : ' Posen') + '</span>' +
      ((S.f.q || nFilters()) ? '<button class="linkbtn" data-act="reset">Alles zurücksetzen</button>' : '') + '</div>';
    if (!list.length) h += '<p class="empty">Keine Pose passt. Lockere die Filter oder ändere die Suche.</p>';
    h += '<div class="grid">';
    list.forEach(function (p) {
      var img = p.images[0] && S.imgs[p.images[0]];
      h += '<a class="card" href="#/pose/' + encodeURIComponent(p.id) + '">' +
        '<div class="thumb">' + (img ? '<img src="' + img + '" alt="" loading="lazy">' : '<span class="ph-ini">' + esc(initials(p.en)) + '</span>') + '</div>' +
        '<div class="cbody"><div class="en">' + esc(p.en) + '</div><div class="de">' + esc(p.de) + '</div>' +
        (p.sa ? '<div class="sa">' + esc(p.sa) + '</div>' : '') +
        '<div class="cmeta">' + p.phases.map(function (x) { return '<span class="pdot" title="' + esc(x) + '" style="background:' + PHASE[x].c + '"></span>'; }).join('') +
        '<span class="muted small">' + esc(p.types.join(' · ')) + '</span>' + (p.full ? '' : '<span class="basic">nur Grunddaten</span>') + '</div></div></a>';
    });
    el.innerHTML = h + '</div>';
  }

  /* Pose */
  function poseLinks(text) {
    var t = esc(text);
    if (!S.data) return t;
    var low = norm(text), best = null;
    S.data.poses.forEach(function (p) {
      var n = norm(p.en);
      if (n.length > 4 && low.indexOf(n) >= 0 && (!best || n.length > norm(best.en).length)) best = p;
    });
    return best ? '<a class="pl" href="#/pose/' + encodeURIComponent(best.id) + '">' + t + '</a>' : t;
  }
  function renderPose(id) {
    var app = $('app'), p = S.byId[id];
    if (!p) { app.innerHTML = '<div class="wrap"><p class="empty">Diese Pose gibt es nicht (mehr).</p><p style="text-align:center"><a class="btn" href="#/" style="display:inline-flex;align-items:center">Zur Übersicht</a></p></div>'; return; }
    if (!S.list.length) S.list = filtered().map(function (x) { return x.id; });
    var list = S.list.indexOf(id) >= 0 ? S.list : S.data.poses.map(function (x) { return x.id; });
    var i = list.indexOf(id), prev = list[i - 1], next = list[i + 1];
    var h = '<div class="navbar"><a class="ibtn" href="#/" aria-label="Zur Übersicht">‹ Übersicht</a><span class="pos">' + (i + 1) + ' von ' + list.length + '</span>' +
      '<button class="ibtn" data-go="' + esc(prev || '') + '"' + (prev ? '' : ' disabled') + ' aria-label="Vorherige Pose">‹</button>' +
      '<button class="ibtn" data-go="' + esc(next || '') + '"' + (next ? '' : ' disabled') + ' aria-label="Nächste Pose">›</button></div>';
    h += '<div class="pose" id="poseBody">';
    var imgs = p.images.filter(function (n) { return S.imgs[n]; });
    var k = Math.min(S.imgIdx[id] || 0, Math.max(imgs.length - 1, 0));
    if (imgs.length) {
      h += '<div class="hero"><img src="' + S.imgs[imgs[k]] + '" alt="Zeichnung ' + esc(p.en) + '">';
      if (imgs.length > 1) {
        h += '<div class="thumbs">' + imgs.map(function (n, j) { return '<button class="' + (j === k ? 'on' : '') + '" data-img="' + j + '" aria-label="Bild ' + (j + 1) + '"><img src="' + S.imgs[n] + '" alt=""></button>'; }).join('') + '</div>';
      }
      h += '</div>';
    } else h += '<div class="hero none">Noch keine Zeichnung</div>';
    h += '<div class="names"><h1>' + esc(p.en) + '</h1><div class="de">' + esc(p.de) + '</div>' + (p.sa ? '<div class="sa">' + esc(p.sa) + '</div>' : '') + '</div>';
    h += '<div class="tags">' + p.phases.map(function (x) { return '<span class="tag ph" style="' + phStyle(x) + '">' + esc(x) + '</span>'; }).join('') +
      p.types.map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') +
      p.targets.map(function (x) { return '<span class="tag tg">' + esc(x) + '</span>'; }).join('') +
      (p.chair ? '<span class="tag">Chair friendly</span>' : '') + '</div>';
    var draft = /^claude/i.test(p.text || '');
    if (S.data.proposal) h += '<p class="note">Flow Phase und Target sind Vorschläge und noch nicht geprüft.' + (draft ? ' Den Text hat Claude als Entwurf geschrieben.' : '') + '</p>';
    var cue = p.sections.filter(function (s) { return s.key === 'cue'; })[0];
    if (cue && cue.items.length) h += '<div class="cue"><h2>Cue card</h2><ol>' + cue.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
    if (!p.full) h += '<div class="box">Für diese Pose gibt es bisher nur die Grunddaten. Die Beschreibung kommt später dazu.</div>';
    p.sections.forEach(function (s) {
      if (s.key === 'cue') return;
      var open = s.key === 'description' || s.key === 'steps';
      var linky = s.key === 'preparatory' || s.key === 'counter' || s.key === 'followup' || s.key === 'variations';
      h += '<details class="sec"' + (open ? ' open' : '') + '><summary>' + esc(s.title) + '</summary><div class="in">' +
        s.text.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
        (s.items.length ? (s.key === 'steps' ? '<ol>' : '<ul>') + s.items.map(function (t) { return '<li>' + (linky ? poseLinks(t) : esc(t)) + '</li>'; }).join('') + (s.key === 'steps' ? '</ol>' : '</ul>') : '') +
        '</div></details>';
    });
    h += '</div>';
    app.innerHTML = h;
    window.scrollTo(0, 0);
  }

  /* Lernen */
  function learnPool() {
    var poses = pref.scope === 'filter' ? filtered() : (S.data ? S.data.poses : []);
    var cards = [];
    poses.forEach(function (p) {
      DIRS.forEach(function (d) {
        if (!pref.dirs[d.k]) return;
        if (d.sa && (!pref.sanskrit || !p.sa)) return;
        if (d.k === 'img' && !p.images.some(function (n) { return S.imgs[n]; })) return;
        cards.push(p.id + '|' + d.k);
      });
    });
    return cards;
  }
  function stats(cards) {
    var s = { sure: 0, seen: 0, fresh: 0, due: 0 }, now = Date.now();
    cards.forEach(function (c) {
      var st = learn[c];
      if (!st) { s.fresh++; return; }
      s.seen++; if (st.b >= 4) s.sure++;
      if (st.d <= now) s.due++;
    });
    return s;
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function startSession() {
    var cards = learnPool(), now = Date.now();
    var due = cards.filter(function (c) { return learn[c] && learn[c].d <= now; }).sort(function (a, b) { return learn[a].b - learn[b].b; });
    var fresh = shuffle(cards.filter(function (c) { return !learn[c]; }));
    var rest = cards.filter(function (c) { return learn[c] && learn[c].d > now; }).sort(function (a, b) { return learn[a].b - learn[b].b || learn[a].d - learn[b].d; });
    var q = due.slice(0, SESSION_SIZE);
    if (q.length < SESSION_SIZE) q = q.concat(fresh.slice(0, SESSION_SIZE - q.length));
    if (q.length < SESSION_SIZE) q = q.concat(rest.slice(0, SESSION_SIZE - q.length));
    if (!q.length) { toast('Wähle mindestens eine Richtung'); return; }
    S.session = { q: shuffle(q), done: 0, total: q.length, known: 0, again: 0, show: false };
    renderLearn();
  }
  function answer(knew) {
    var s = S.session, c = s.q.shift(), st = learn[c] || { b: 1, d: 0 };
    if (knew) { st.b = Math.min(st.b + 1, 5); st.d = Date.now() + INTERVAL[st.b] * 864e5; s.known++; s.done++; }
    else { st.b = 1; st.d = Date.now(); s.again++; s.q.splice(Math.min(3, s.q.length), 0, c); }
    learn[c] = st; saveLearn();
    s.show = false;
    renderLearn();
  }
  function cardHtml(c, show) {
    var parts = c.split('|'), p = S.byId[parts[0]], dir = parts[1];
    if (!p) return '';
    var img = p.images.filter(function (n) { return S.imgs[n]; })[0];
    var label = DIRS.filter(function (d) { return d.k === dir; })[0].label;
    var q = '';
    if (dir === 'enDe') q = '<div class="q">' + esc(p.en) + '</div>';
    else if (dir === 'deEn') q = '<div class="q">' + esc(p.de) + '</div>';
    else if (dir === 'img') q = '<img class="qi" src="' + S.imgs[img] + '" alt="Welche Pose ist das?">';
    else q = '<div class="q" style="font-style:italic">' + esc(p.sa) + '</div>';
    var a = '';
    if (show) {
      var big = dir === 'enDe' ? p.de : p.en, sub = dir === 'enDe' ? '' : (dir === 'deEn' ? '' : p.de);
      a = '<div class="a"><div class="big">' + esc(big) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        (pref.sanskrit && p.sa && dir !== 'sa' ? '<div class="sa">' + esc(p.sa) + '</div>' : '') +
        (img && dir !== 'img' ? '<img class="mini" src="' + S.imgs[img] + '" alt="">' : '') +
        '<div style="margin-top:8px"><a class="linkbtn" href="#/pose/' + encodeURIComponent(p.id) + '">Pose ansehen</a></div></div>';
    }
    return '<div class="fc"><div class="dir">' + esc(label) + '</div>' + q + a + '</div>';
  }
  function renderLearn() {
    var app = $('app');
    if (!S.data) { app.innerHTML = '<div class="wrap"><div class="top"><h1>Lernen</h1></div>' + welcome() + '</div>'; return; }
    var s = S.session;
    if (s && s.q.length) {
      var pct = Math.round(s.done / s.total * 100);
      app.innerHTML = '<div class="wrap flash"><div class="top"><h1>Lernen</h1><button class="linkbtn" data-act="end-session">Beenden</button></div>' +
        '<div class="count"><span>' + s.done + ' von ' + s.total + ' gewusst</span><span>' + (s.again ? s.again + '× nochmal' : '') + '</span></div>' +
        '<div class="prog"><i style="width:' + pct + '%"></i></div>' + cardHtml(s.q[0], s.show) +
        (s.show ? '<div class="answer-btns"><button class="btn again" data-act="again">Nochmal</button><button class="btn know" data-act="know">Gewusst</button></div>'
          : '<div style="margin-top:12px"><button class="btn solid wide" data-act="reveal">Aufdecken</button></div>') + '</div>';
      return;
    }
    var h = '<div class="wrap flash"><div class="top"><h1>Lernen</h1></div>';
    if (s && !s.q.length) {
      h += '<div class="panel" style="text-align:center"><h2>Geschafft</h2><p class="muted" style="margin:0 0 12px">' + s.total + ' Karten, ' + (s.again ? s.again + '× brauchtest du einen zweiten Anlauf.' : 'alle beim ersten Mal gewusst.') + '</p>' +
        '<button class="btn solid" data-act="start">Weiter lernen</button></div>';
      S.session = null;
    }
    var cards = learnPool(), st = stats(cards);
    h += '<div class="stats"><div class="stat"><b>' + st.sure + '</b><span>sicher</span></div><div class="stat"><b>' + (st.seen - st.sure) + '</b><span>im Lernen</span></div><div class="stat"><b>' + st.fresh + '</b><span>neu</span></div></div>';
    h += '<div class="panel"><h2>Was abfragen?</h2><div class="chips">';
    DIRS.forEach(function (d) { if (d.sa && !pref.sanskrit) return; h += '<button class="chip' + (pref.dirs[d.k] ? ' on' : '') + '" data-dir="' + d.k + '">' + esc(d.label) + '</button>'; });
    h += '</div>' + (pref.sanskrit ? '' : '<p class="small muted" style="margin:10px 0 0">Sanskrit-Karten schaltest du in den Einstellungen ein.</p>') + '</div>';
    var nf = filtered().length;
    h += '<div class="panel"><h2>Welche Posen?</h2><div class="seg"><button class="' + (pref.scope !== 'filter' ? 'on' : '') + '" data-scope="all">Alle (' + S.data.poses.length + ')</button><button class="' + (pref.scope === 'filter' ? 'on' : '') + '" data-scope="filter">Aktueller Filter (' + nf + ')</button></div>' +
      '<p class="small muted" style="margin:10px 0 0">Den Filter stellst du unter „Stöbern“ ein, z. B. nur Peak-Posen.</p></div>';
    h += '<button class="btn solid wide" data-act="start">' + (st.due ? st.due + ' fällige Karten lernen' : 'Lernen starten') + '</button>';
    h += '<p class="small muted" style="text-align:center;margin-top:10px">' + cards.length + ' Karten insgesamt. Pro Runde bis zu ' + SESSION_SIZE + '. Was du weißt, kommt später wieder, was du nicht weißt, bald.</p></div>';
    app.innerHTML = h;
  }

  /* Einstellungen */
  function renderSettings() {
    var app = $('app'), d = S.data, synced = lsGet('as.synced', 0);
    var h = '<div class="wrap set" style="max-width:640px"><div class="top"><h1>Einstellungen</h1></div>';
    h += '<div class="panel"><h2>Daten</h2>';
    if (LOCAL) h += '<p class="small muted">Testmodus auf diesem Computer: Die Daten kommen aus dem Ordner „dev-daten“.</p>';
    h += d ? '<p>' + d.poses.length + ' Posen, davon ' + d.poses.filter(function (p) { return p.full; }).length + ' ausführlich. Stand ' + esc(d.version.slice(6, 8) + '.' + d.version.slice(4, 6) + '.' + d.version.slice(0, 4)) +
      (synced ? ', zuletzt geprüft ' + new Date(synced).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '') + '.</p>' : '<p>Noch keine Daten auf diesem Gerät.</p>';
    h += '<button class="btn sm" data-act="sync"' + (LOCAL || connected() ? '' : ' disabled') + '>Jetzt aktualisieren</button></div>';
    if (!LOCAL) {
      h += '<div class="panel"><h2>Dropbox</h2>';
      if (!connected()) {
        h += '<p>Die App liest die Posen aus deiner Dropbox und speichert sie auf diesem Gerät.</p><ol>' +
          '<li><p>Bei Dropbox anmelden und den Zugriff erlauben. Dropbox zeigt dir danach einen Code.</p><a class="btn solid sm" id="dbxLink" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center">Bei Dropbox anmelden</a></li>' +
          '<li><p>Den Code kopieren, hierher zurückkommen und einfügen.</p><label class="field"><span>Code von Dropbox</span><input type="text" id="code" autocapitalize="off" autocomplete="off" spellcheck="false"></label>' +
          '<p class="err" id="codeErr"' + (S.connectErr ? '' : ' hidden') + '>' + esc(S.connectErr) + '</p><button class="btn solid sm" data-act="connect">Verbinden</button></li></ol>';
      } else {
        h += '<p>Verbunden. Die App liest aus diesem Ordner deiner Dropbox:</p><label class="field"><span>Ordner</span><input type="text" id="folder" value="' + esc(pref.folder) + '" autocapitalize="off" spellcheck="false"></label>' +
          '<div class="row"><button class="btn sm" data-act="save-folder">Ordner speichern</button><button class="btn sm" data-act="disconnect">Verbindung trennen</button></div>';
      }
      h += '</div>';
    }
    h += '<div class="panel"><h2>Lernen</h2><div class="toggle"><span>Sanskrit-Karten</span><button class="sw' + (pref.sanskrit ? ' on' : '') + '" data-act="sanskrit" aria-label="Sanskrit-Karten"></button></div>' +
      '<p class="small muted">Wenn eingeschaltet, gibt es zusätzlich Karten „Sanskrit → Name“, und die Antworten zeigen den Sanskrit-Namen.</p>' +
      '<button class="btn sm" data-act="reset-learn">Lernstand zurücksetzen</button></div>';
    h += '<div class="panel"><h2>Ansicht</h2><div class="seg">' + [['auto', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']].map(function (t) { return '<button class="' + (pref.theme === t[0] ? 'on' : '') + '" data-theme="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div></div>';
    h += '<p class="small muted" style="text-align:center">Asanas · Version ' + VERSION + '</p></div>';
    app.innerHTML = h;
    var link = $('dbxLink');
    if (link) prepareConnect().then(function (u) { link.href = u; });
  }

  /* ---------- Bedienung ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-f],[data-go],[data-img],[data-dir],[data-scope],[data-theme]');
    if (!t) return;
    if (t.hasAttribute('data-f')) {
      var g = t.getAttribute('data-f'), v = t.getAttribute('data-v'), arr = S.f[g], ix = arr.indexOf(v);
      if (ix >= 0) arr.splice(ix, 1); else arr.push(v);
      renderBrowse(); return;
    }
    if (t.hasAttribute('data-go')) { var id = t.getAttribute('data-go'); if (id) location.hash = '#/pose/' + encodeURIComponent(id); return; }
    if (t.hasAttribute('data-img')) { S.imgIdx[route().id] = +t.getAttribute('data-img'); renderPose(route().id); return; }
    if (t.hasAttribute('data-dir')) { var k = t.getAttribute('data-dir'); pref.dirs[k] = !pref.dirs[k]; savePref(); renderLearn(); return; }
    if (t.hasAttribute('data-scope')) { pref.scope = t.getAttribute('data-scope'); savePref(); renderLearn(); return; }
    if (t.hasAttribute('data-theme')) { pref.theme = t.getAttribute('data-theme'); savePref(); applyTheme(); renderSettings(); return; }
    switch (t.getAttribute('data-act')) {
      case 'toggle-filter': S.filterOpen = !S.filterOpen; renderBrowse(); break;
      case 'reset': S.f = { q: '', phases: [], types: [], targets: [] }; renderBrowse(); break;
      case 'clear-q': S.f.q = ''; renderBrowse(); $('q').focus(); break;
      case 'start': startSession(); break;
      case 'reveal': S.session.show = true; renderLearn(); break;
      case 'know': answer(true); break;
      case 'again': answer(false); break;
      case 'end-session': S.session = null; renderLearn(); break;
      case 'sync': sync(true); break;
      case 'sanskrit': pref.sanskrit = !pref.sanskrit; pref.dirs.sa = pref.sanskrit; savePref(); renderSettings(); break;
      case 'reset-learn': if (confirm('Lernstand wirklich zurücksetzen? Alle Karten gelten dann wieder als neu.')) { learn = {}; saveLearn(); toast('Lernstand zurückgesetzt'); } break;
      case 'connect':
        var code = ($('code').value || '').trim();
        if (!code) { S.connectErr = 'Füge zuerst den Code von Dropbox ein.'; renderSettings(); break; }
        exchange(code).then(function () { S.connectErr = ''; toast('Mit Dropbox verbunden'); renderSettings(); sync(true); })
          .catch(function (err) { S.connectErr = err.message || 'Das hat nicht geklappt.'; renderSettings(); });
        break;
      case 'save-folder':
        var fv = ($('folder').value || '').trim().replace(/\/+$/, '');
        if (fv) { if (fv[0] !== '/') fv = '/' + fv; pref.folder = fv; savePref(); toast('Ordner gespeichert'); sync(true); }
        break;
      case 'disconnect': if (confirm('Verbindung zu Dropbox trennen? Die gespeicherten Posen bleiben auf dem Gerät.')) { auth = null; saveAuth(); renderSettings(); } break;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') {
      S.f.q = e.target.value;
      var c = document.querySelector('.search .clear'); if (c) c.hidden = !S.f.q;
      renderList();
    }
  });
  document.addEventListener('keydown', function (e) {
    var r = route();
    if (r.v === 'pose' && !/input|textarea/i.test(e.target.tagName)) {
      var b = document.querySelectorAll('.navbar [data-go]');
      if (e.key === 'ArrowLeft' && b[0]) b[0].click();
      if (e.key === 'ArrowRight' && b[1]) b[1].click();
    }
    if (r.v === 'learn' && S.session && S.session.q.length && !/input/i.test(e.target.tagName)) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!S.session.show) { S.session.show = true; renderLearn(); } else answer(true); }
      if (S.session.show && (e.key === 'n' || e.key === 'Backspace')) answer(false);
    }
  });
  /* Wischen in der Pose: links/rechts = nächste/vorherige */
  var tx = null, ty = null;
  document.addEventListener('touchstart', function (e) { if (route().v !== 'pose') return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      var b = document.querySelectorAll('.navbar [data-go]');
      var btn = dx < 0 ? b[1] : b[0];
      if (btn && !btn.disabled) btn.click();
    }
  }, { passive: true });

  window.addEventListener('hashchange', render);

  /* ---------- Start ---------- */
  (async function start() {
    render();
    if (await loadCached()) render();
    if (LOCAL || connected()) sync(false);
  })();

  /* Offline-Fähigkeit und Updates */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { reg.update(); if (connected()) sync(false); } });
    }).catch(function () {});
    var reloading = false, hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading || !hadController) { hadController = true; return; }
      if (S.session && S.session.q.length) { toast('Neue Version da. Sie lädt nach dem Lernen.'); return; }
      reloading = true; location.reload();
    });
  }
})();
</script>
</body>
</html>
